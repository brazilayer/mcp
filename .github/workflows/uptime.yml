# Monitor de uptime EXTERNO da API (pendência D-0001 do pedagio, implantado 2026-08-13).
#
# Roda fora do VPS de propósito: se o servidor inteiro cair, o cron interno cai junto —
# este job continua rodando na infra do GitHub e falha alto. Vive neste repo porque ele
# é público (minutos de Actions ilimitados; o repo principal é privado e estouraria a
# cota grátis com cron de 10 min).
#
# Alerta em duas camadas:
#  1. Job falho → e-mail automático do GitHub ao dono do repo (zero configuração).
#  2. Push no celular via ntfy.sh, SE o secret NTFY_TOPIC existir no repo — mesmo
#     tópico que o VPS usa (/opt/pedagio/.env). Para ligar:
#     gh secret set NTFY_TOPIC -R brazilayer/mcp --body "<topico>"
name: uptime
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API e site respondem
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -u
          falhas=""

          # 3 tentativas com 20s de intervalo: curl único de runner compartilhado gera
          # falso positivo (2 casos em 13-14/08 e 1 em 30/08 11:19 UTC, "HTTP 000" no
          # www com a API respondendo na MESMA execução e nenhuma requisição do runner
          # chegando ao access log do servidor: a falha foi da rede do runner). Além de
          # insistir mais, guarda a mensagem de erro do curl para o próximo diagnóstico.
          checar() { # $1=url  $2=grep-opcional  → ecoa o code final
            local code
            for i in 1 2 3; do
              code=$(curl -sS -o corpo.json -w '%{http_code}' --max-time 25 "$1" 2>erro.txt || echo 000)
              if [ "$code" = "200" ] && { [ -z "$2" ] || grep -q "$2" corpo.json; }; then
                echo "$code"; return 0
              fi
              echo "tentativa $i: HTTP $code $(tr -d '\n' < erro.txt | cut -c1-160)" >&2
              [ "$i" != "3" ] && sleep 20
            done
            echo "$code"; return 1
          }

          code=$(checar https://api.brazilayer.com/v1/health '"status":"ok"') \
            || falhas="api.brazilayer.com/v1/health devolveu HTTP $code (3 tentativas)"

          site=$(checar https://www.brazilayer.com '') \
            || falhas="${falhas:+$falhas; }www.brazilayer.com devolveu HTTP $site (3 tentativas)"

          if [ -n "$falhas" ]; then
            echo "::error::$falhas"
            if [ -n "${NTFY_TOPIC:-}" ]; then
              curl -s --max-time 15 \
                -H "Title: Brazilayer fora do ar" -H "Priority: urgent" -H "Tags: rotating_light" \
                -d "$falhas (monitor externo, GitHub Actions, $(date -u +'%Y-%m-%d %H:%M') UTC)" \
                "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
            fi
            exit 1
          fi
          echo "ok: api $code, site $site"
